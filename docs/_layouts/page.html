---
layout: default
---
<article class="page prose">
  <header class="page-header">
    <p class="eyebrow">{{ site.title | escape }}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="article-deck">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="page-body">
    {{ content }}
  </div>
</article>
